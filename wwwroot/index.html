<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaServ - Organize seus atendimentos</title>
    <meta name="description" content="Agenda de atendimentos do ConectaServ.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>ConectaServ</h1>
            <p>Organize seus atendimentos em um único lugar.</p>
        </div>
    </header>

    <main class="container grid-layout">
        <section class="card new-appointment" aria-labelledby="new-appointment-title">
            <h2 id="new-appointment-title">Novo Atendimento</h2>
            <p class="form-instructions" id="form-instructions">
                Todos os campos são obrigatórios.
            </p>
            <div id="message-container" class="message-container" aria-live="polite" aria-atomic="true"></div>
            <form id="appointment-form" aria-describedby="form-instructions" novalidate>
                <div class="form-group">
                    <label for="cliente">Cliente <span aria-hidden="true">*</span></label>
                    <input type="text" id="cliente" name="cliente" required maxlength="100" autocomplete="name" placeholder="Nome do cliente">
                </div>
                <div class="form-group">
                    <label for="servico">Serviço <span aria-hidden="true">*</span></label>
                    <input type="text" id="servico" name="servico" required maxlength="100" placeholder="Ex.: Manicure">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data <span aria-hidden="true">*</span></label>
                        <input type="date" id="data" name="data" required>
                    </div>
                    <div class="form-group">
                        <label for="horario">Horário <span aria-hidden="true">*</span></label>
                        <input type="time" id="horario" name="horario" required step="60">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">Agendar</button>
            </form>
        </section>

        <section class="card schedule" id="schedule" aria-labelledby="schedule-title">
            <h2 id="schedule-title">Agenda</h2>
            <div id="loading" class="loading-state" role="status" hidden>Carregando atendimentos...</div>
            <ul class="appointment-list" id="appointment-list" aria-live="polite" aria-busy="false">
                <li class="empty-state" role="status">Nenhum atendimento cadastrado.</li>
            </ul>
        </section>
    </main>

    <noscript>
        <p class="noscript-message">Ative o JavaScript do navegador para consultar e cadastrar atendimentos.</p>
    </noscript>
    <script src="js/app.js"></script>
</body>
</html>
